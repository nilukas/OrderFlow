openapi: 3.0.3
info:
  title: OrderFlow Orders API
  version: 1.0.0
  description: >
    Contract-first definition of the Orders API. This file is the source of truth. Generate clients from it
    (for example with Microsoft Kiota or NSwag) instead of hand-writing them.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/orders:
    post:
      summary: Create an order
      operationId: createOrder
      security:
        - bearerAuth: [orders.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Missing or invalid access token
        "403":
          description: Token lacks the orders.write scope
  /api/v1/orders/{id}:
    get:
      summary: Get an order
      operationId: getOrder
      security:
        - bearerAuth: [orders.read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Missing or invalid access token
        "403":
          description: Token lacks the orders.read scope
        "404":
          description: Order not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Validation problem (problem details)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
              detail:
                type: string
              status:
                type: integer
  schemas:
    CreateOrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        unitPrice:
          type: number
          minimum: 0
          maximum: 1000000
    CreateOrderRequest:
      type: object
      required: [customerReference, lines]
      properties:
        customerReference:
          type: string
          maxLength: 64
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreateOrderLine"
    OrderLine:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        lineTotal:
          type: number
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerReference:
          type: string
        status:
          type: string
          enum: [Created]
        totalAmount:
          type: number
        createdAtUtc:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
